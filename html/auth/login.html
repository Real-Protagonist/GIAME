<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIAME - Login</title>
  <link rel="stylesheet" href="../../css/tailwind/output.css">
  <link rel="stylesheet" href="../../css/index.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
   <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex items-center justify-center min-h-screen p-4 bg-gray-50">
  <div class="flex flex-col w-full max-w-6xl overflow-hidden bg-white border shadow-sm md:flex-row rounded-xl">
    <!-- Lado do logo -->
    <div class="w-full md:w-[35%] bg-secondary flex items-center justify-center py-6 md:py-0">
      <div class="flex flex-col items-center gap-2 transition-all duration-300 transform scale-95 md:scale-100">
        <img src="../../assets/logos/IMG-20250702-WA0005-removebg-preview.png" alt="Logo"
          class="object-contain w-20 h-20" />
        <span class="text-3xl font-bold text-white">GIAME</span>
      </div>
    </div>

    <!-- Lado do formulário -->
    <div class="w-full md:w-[65%] flex flex-col justify-between px-6 py-6 md:p-10">
      <!-- Cabeçalho -->
      <div>
        <h1 class="text-2xl font-bold text-primary">Login</h1>
        <!-- <p class="mt-1 text-sm text-gray-500">Comece seu teste grátis</p> -->
      </div>

      <form class="mt-6 form-grid form-col-2">
        <!-- Email -->
        <div class="form-full">
          <label for="email" class="label">Email</label>
          <input type="email" id="email_usuario" name="email_usuario" required placeholder="email@exemplo.com" class="input" />
        </div>

        <!-- Senha -->
        <div class="form-full">
          <label for="senha" class="label">Senha</label>
          <input type="password" id="senha_usuario" name="senha_usuario" required placeholder="********" class="input" />
        </div>

        <!-- Botão de enviar -->
        <div class="mt-2 form-full">
          <button type="submit" class="btn">
            Login
          </button>
        </div>

        <!-- Links -->
        <div class="mt-4 space-y-2 text-sm text-center text-gray-600 sm:col-span-2">
          <p>Não tem uma conta?
            <a href="register.html" class="btn-link">Criar conta</a>
          </p>
          <p>
            <a href="password-recovery.html" class="btn-link">
              Recuperar senha
            </a>
          </p>
          <p>
            <a href="../../index.html" class="inline-flex items-center gap-1 text-gray-500 hover:text-gray-700">
              <i data-lucide="arrow-left" class="w-4 h-4"></i> Voltar ao início
            </a>
          </p>
        </div>
      </form>
    </div>
  </div>

  <!-- <script src="../../js/scripts.js"></script> -->
  <script>
    function showAlert(message, type = 'success') {
      const alertBox = document.getElementById('alert-message');
      alertBox.textContent = message;
      alertBox.className = `fixed top-6 left-1/2 transform -translate-x-1/2 z-50 px-6 py-3 rounded shadow text-white text-center ${type === 'success' ? 'bg-green-600' : 'bg-red-600' }`;
      alertBox.classList.remove('hidden');

      setTimeout(() => {
        alertBox.classList.add('hidden');
      }, 4500);
    }

    document.querySelector('form').addEventListener('submit', async function (e) {
      e.preventDefault();
      // Aqui você pode adicionar a lógica de autenticação
      const form = e.target;
      const formData = new FormData(form);

      const data = {};
      formData.forEach((value, key) => {
        data[key] = value;
      });
      try {
        const response = await fetch('../../assets/conf/conf-login.php', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(data)
        });

        const result = await response.json();
        if (response.ok && result.message)
          window.location.href = '../dashboards/admin/index.html'; // Redireciona para a página inicial
        else
          showAlert(result.error || 'Credenciais inválidas.', 'error');
      } catch (error) {
        showAlert('Ocorreu um erro no login.', 'error');
      }
    });
  </script>
  <div class="fixed top-6 left-1/2 transform -translate-x-1/2 hidden px-6 py-3 rounded shadow text-center" id="alert-message"></div>
</body>
</html>
