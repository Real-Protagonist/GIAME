<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIAME - Criar Conta </title>
  <link rel="stylesheet" href="../../css/tailwind/output.css">
  <link rel="stylesheet" href="../../css/index.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
   <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex items-center justify-center min-h-screen p-4 bg-gray-50">
  <div class="flex flex-col w-full max-w-6xl overflow-hidden bg-white border shadow-sm md:flex-row rounded-xl">
    <!-- Lado do logo -->
    <div class="w-full md:w-[35%] bg-secondary flex items-center justify-center py-6 md:py-0">
      <div class="flex flex-col items-center gap-2 transition-all duration-300 transform scale-95 md:scale-100">
        <img src="../../assets/logos/IMG-20250702-WA0005-removebg-preview.png" alt="Logo"
          class="object-contain w-20 h-20" />
        <span class="text-3xl font-bold text-white">GIAME</span>
      </div>
    </div>

    <!-- Lado do formulário -->
    <div class="w-full md:w-[65%] flex flex-col justify-between px-6 py-6 md:p-10">
      <!-- Cabeçalho -->
      <div>
        <h1 class="text-2xl font-bold text-primary">Solicitação de acesso</h1>
        <!-- <p class="mt-1 text-sm text-gray-500">Comece seu teste grátis</p> -->
      </div>

      <form class="mt-6 form-grid form-col-2">
        <!-- Nome -->
        <!-- <div class="form-full">
          <label for="name" class="label">Nome </label>
          <input type="text" id="name" name="name" required placeholder="João da Silva" class="input" />
        </div> -->

        <div>
          <label for="primeiro_nome" class="label">Primeiro Nome</label>
          <input type="text" id="primeiro_nome" name="primeiro_nome" required placeholder="John" class="input" />
        </div>

        <div>
          <label for="ultimo_nome" class="label">Último Nome</label>
          <input type="text" id="ultimo_nome" name="ultimo_nome" required placeholder="Doe" class="input" />
        </div>

        <!-- Endereço -->
        <div class="form-full">
          <label for="address" class="label">Endereço</label>
          <input type="text" id="address" name="address" required placeholder="Rua 12, Bairro Azul, Luanda"
            class="input" />
        </div>

        <!-- Contacto -->
        <div>
          <label for="contact" class="label">Contacto</label>
          <input type="text" id="contact" name="contact" required placeholder="+244 923 456 789"
             title="Formato esperado: +244 XXX XXX XXX" class="input" />
        </div>

        <!-- NIF -->
        <div>
          <label for="nif" class="label">NIF</label>
          <input type="text" id="nif" name="nif" required placeholder="Insira o NIF" class="input" />
        </div>

        <!-- Email -->
        <div class="form-full">
          <label for="email_usuario" class="label">Email</label>
          <input type="email" id="email_usuario" name="email_usuario" required placeholder="email@exemplo.com" class="input" />
        </div>

        <div class="form-full">
          <label for="senha_usuario" class="label">Senha</label>
          <input type="password" id="senha_usuario" name="senha_usuario" required placeholder="Insira a senha" class="input" />
        </div>

        <div class="form-full">
          <label for="confirm-senha_usuario" class="label">Confirmar Senha</label>
          <input type="password" id="confirm-senha_usuario" name="confirm-senha_usuario" required placeholder="Confirme a senha" class="input" />
        </div>

        <!-- Tipo de cliente -->
        <div>
          <label for="type" class="label">Tipo de cliente</label>
          <select id="type" name="type" required class="input">
            <option value="" disabled selected>Selecione o tipo</option>
            <option value="empresa">Empresa</option>
            <option value="particular">Particular</option>
          </select>
        </div>

        <!-- Nº de utilizadores -->
        <div>
          <label for="users" class="label">Nº de utilizadores</label>
          <input type="number" id="users" name="users" required placeholder="0" min="0" class="input" />
        </div>

        <!-- Botão de enviar -->
        <div class="mt-2 form-full">
          <button type="submit" class="btn">
            Criar conta
          </button>
        </div>

        <!-- Links -->
        <div class="mt-4 space-y-2 text-sm text-center text-gray-600 sm:col-span-2">
          <p>Já tem uma conta?
            <a href="login.html" class="btn-link">Fazer login</a>
          </p>
          <p>
            <a href="reativacao.html" class="btn-link">
              Solicitar reativação
            </a>
          </p>
          <p>
            <a href="../../index.html" class="inline-flex items-center gap-1 text-gray-500 hover:text-gray-700">
              <i data-lucide="arrow-left" class="w-4 h-4"></i> Voltar ao início
            </a>
          </p>
        </div>
      </form>
    </div>
  </div>

  <!-- <script src="../../js/scripts.js"></script> -->
  <script>
    document.querySelector('form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const form = e.target;
      const formData = new FormData(form);

      const data = {};
      formData.forEach((value, key) => {
        data[key] = value;
      });
      try {
        const response = await fetch('../../assets/conf/conf-register.php', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(data)
        });

        const result = await response.json();
        if (response.ok) {
          alert(result.message || 'Solicitação enviada com sucesso!');
          form.reset();
        } else {
          alert(result.error || 'Ocorreu um erro ao enviar a solicitação.');
        }
      } catch (error) {
        // console.error('Erro:', error);
        alert('Ocorreu um erro ao enviar a solicitação.');
      }
    });
  </script>
</body>

</html>
